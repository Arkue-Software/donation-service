services:
  donacion-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-db_donacion}"
      DB_USER: "${DB_USER:-donacion_servicio}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      DB_SSL_MODE: "${DB_SSL_MODE:-prefer}"
      FLYWAY_USER: "${FLYWAY_USER:-donacion_propietario}"
      FLYWAY_PASSWORD: "${FLYWAY_PASSWORD:-secret}"
      CAMPANIA_SERVICE_URL: "${CAMPANIA_SERVICE_URL:-http://redvital-campania-service:8081}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
