name: Deploy RedVital Donacion QA

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Detener y limpiar la versión anterior
        run: |
          docker stop redvital-donacion-qa-container || true
          docker rm redvital-donacion-qa-container || true

      - name: Construir la nueva imagen de Docker
        # Utiliza el Dockerfile incluido en la raíz de tu proyecto Java
        run: docker build -t redvital-donacion:qa -f Dockerfile .

      - name: Desplegar el nuevo contenedor
        # Se expone en el puerto 5002 de la VM y se pasa el perfil de Spring Boot
        run: |
          docker run -d \
            --name redvital-donacion-qa-container \
            -p 5002:8080 \
            -e SPRING_PROFILES_ACTIVE=qa \
            --restart unless-stopped \
            redvital-donacion:qa